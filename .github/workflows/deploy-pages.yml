name: Publish docs via GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: ['1.21', '26.*']
    paths: ['docs/**']

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: build docs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: './docs'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.ref_name }}'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install packages
        run: pip install -r ./requirements.txt
      - name: Set git username and password
        run: git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Deploy pages to gh-pages branch
        env:
          DOCS_VERSION: ${{ github.ref_name }}
          MKDOCS_EDIT_URI: blob/${{ github.ref_name }}/docs/content/
        run: mike deploy "$DOCS_VERSION" --push
      - name: Set the default docs version
        if: github.ref_name == github.event.repository.default_branch
        env:
          DOCS_VERSION: ${{ github.ref_name }}
        run: mike set-default "$DOCS_VERSION" --push
